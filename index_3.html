<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>语法宝典 · HSK 4–6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fdf8f0;
    --warm-white: #fff9f2;
    --parchment: #f5ede0;
    --ink: #2a1f14;
    --ink-light: #5a4a3a;
    --ink-faint: #9a8a7a;
    --red: #c0392b;
    --red-soft: #e8503a;
    --gold: #c9853a;
    --gold-light: #e8a855;
    --sage: #5a7a5a;
    --sage-light: #7aaa7a;
    --sky: #4a7a9b;
    --sky-light: #6a9ab8;
    --lavender: #7a6a9b;
    --rose: #c07080;
    
    --hsk4-color: #5a7a5a;
    --hsk5-color: #4a7a9b;
    --hsk6-color: #7a4a9b;
    
    --card-bg: #ffffff;
    --border: rgba(42,31,20,0.1);
    --shadow: 0 4px 20px rgba(42,31,20,0.08);
    --shadow-hover: 0 8px 32px rgba(42,31,20,0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  .app-header {
    background: var(--warm-white);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px 12px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
  }
  .header-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.3px;
  }
  .header-sub {
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* ── FILTERS ── */
  .filter-bar {
    padding: 14px 16px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    background: var(--warm-white);
    border-bottom: 1px solid var(--border);
    scrollbar-width: none;
  }
  .filter-bar::-webkit-scrollbar { display: none; }
  
  .filter-btn {
    flex-shrink: 0;
    padding: 7px 14px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: transparent;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-light);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .filter-btn.active-all { background: var(--ink); color: white; border-color: var(--ink); }
  .filter-btn.active-4 { background: var(--hsk4-color); color: white; border-color: var(--hsk4-color); }
  .filter-btn.active-5 { background: var(--hsk5-color); color: white; border-color: var(--hsk5-color); }
  .filter-btn.active-6 { background: var(--hsk6-color); color: white; border-color: var(--hsk6-color); }
  .filter-btn.active-cat { background: var(--gold); color: white; border-color: var(--gold); }

  /* ── SEARCH ── */
  .search-wrap {
    padding: 12px 16px;
    background: var(--warm-white);
    border-bottom: 1px solid var(--border);
  }
  .search-input {
    width: 100%;
    padding: 10px 16px 10px 38px;
    border-radius: 24px;
    border: 1.5px solid var(--border);
    background: var(--parchment);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--gold); }
  .search-wrap { position: relative; }
  .search-icon {
    position: absolute;
    left: 28px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-faint);
    font-size: 15px;
    pointer-events: none;
  }

  /* ── STATS BAR ── */
  .stats-bar {
    display: flex;
    gap: 0;
    padding: 0 16px;
    margin: 14px 0 0;
  }
  .stat-chip {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 500;
    margin-right: 8px;
  }
  .stat-chip.hsk4 { background: rgba(90,122,90,0.12); color: var(--hsk4-color); }
  .stat-chip.hsk5 { background: rgba(74,122,155,0.12); color: var(--hsk5-color); }
  .stat-chip.hsk6 { background: rgba(122,74,155,0.12); color: var(--hsk6-color); }
  .stat-dot { width: 6px; height: 6px; border-radius: 50%; }
  .hsk4 .stat-dot { background: var(--hsk4-color); }
  .hsk5 .stat-dot { background: var(--hsk5-color); }
  .hsk6 .stat-dot { background: var(--hsk6-color); }

  /* ── CARD GRID ── */
  .cards-container {
    padding: 12px 14px 100px;
  }
  .section-label {
    font-family: 'Lora', serif;
    font-size: 13px;
    font-style: italic;
    color: var(--ink-faint);
    letter-spacing: 0.5px;
    margin: 16px 0 8px 2px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .grammar-card {
    background: var(--card-bg);
    border-radius: 14px;
    border: 1.5px solid var(--border);
    margin-bottom: 12px;
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    cursor: pointer;
  }
  .grammar-card:hover, .grammar-card:active { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
  .grammar-card.expanded { border-color: transparent; box-shadow: var(--shadow-hover); }

  .card-header {
    padding: 14px 16px 12px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .hsk-badge {
    flex-shrink: 0;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-top: 3px;
  }
  .badge-4 { background: rgba(90,122,90,0.15); color: var(--hsk4-color); }
  .badge-5 { background: rgba(74,122,155,0.15); color: var(--hsk5-color); }
  .badge-6 { background: rgba(122,74,155,0.15); color: var(--hsk6-color); }

  .card-main { flex: 1; min-width: 0; }
  .card-pattern {
    font-family: 'Noto Serif SC', serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.3;
    letter-spacing: 0.5px;
  }
  .card-category {
    font-size: 10px;
    font-weight: 500;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 3px;
  }

  .card-body {
    display: none;
    padding: 0 16px 16px;
    border-top: 1px solid var(--parchment);
    margin-top: 2px;
    animation: slideDown 0.25s ease;
  }
  .grammar-card.expanded .card-body { display: block; }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

  .explanation-box {
    background: var(--parchment);
    border-radius: 10px;
    padding: 12px 14px;
    margin-top: 12px;
    font-size: 13px;
    color: var(--ink-light);
    line-height: 1.6;
    font-family: 'Lora', serif;
    font-style: italic;
  }

  .examples-title {
    font-size: 10px;
    font-weight: 600;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin: 14px 0 8px;
  }

  .example-item {
    background: var(--warm-white);
    border-radius: 10px;
    padding: 11px 13px;
    margin-bottom: 8px;
    border-left: 3px solid var(--border);
    transition: border-color 0.2s;
  }
  .example-item:hover { border-left-color: var(--gold); }

  .example-zh {
    font-family: 'Noto Serif SC', serif;
    font-size: 16px;
    font-weight: 600;
    color: #1a3a6a;
    line-height: 1.4;
  }
  .example-pinyin {
    font-size: 12px;
    color: var(--gold);
    margin-top: 4px;
    font-family: 'Lora', serif;
    font-style: italic;
    letter-spacing: 0.3px;
  }
  .example-es {
    font-size: 12.5px;
    color: var(--red-soft);
    margin-top: 3px;
    font-weight: 500;
  }

  .play-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-top: 6px;
    padding: 5px 12px;
    background: var(--ink);
    color: white;
    border: none;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
  }
  .play-btn:hover { background: var(--gold); transform: scale(1.03); }
  .play-btn.playing { background: var(--sage); }
  .play-btn svg { width: 10px; height: 10px; }

  /* ── FLOATING MODE ── */
  .mode-bar {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    background: var(--ink);
    border-radius: 28px;
    padding: 8px 12px;
    box-shadow: 0 8px 32px rgba(42,31,20,0.3);
    z-index: 200;
  }
  .mode-btn {
    padding: 8px 16px;
    border-radius: 20px;
    border: none;
    background: transparent;
    color: rgba(255,255,255,0.6);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mode-btn.active { background: rgba(255,255,255,0.15); color: white; }

  /* ── FLASHCARD MODE ── */
  .flashcard-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--cream);
    z-index: 300;
    flex-direction: column;
    align-items: center;
    padding: 20px 0 80px;
    overflow-y: auto;
  }
  .flashcard-overlay.active { display: flex; }

  .fc-header {
    width: 100%;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: var(--warm-white);
  }
  .fc-close {
    background: none;
    border: none;
    font-size: 22px;
    cursor: pointer;
    color: var(--ink);
    padding: 4px 8px;
    border-radius: 8px;
  }
  .fc-progress {
    font-size: 12px;
    color: var(--ink-faint);
    font-weight: 500;
  }
  .fc-progress-bar {
    width: 100%;
    height: 3px;
    background: var(--parchment);
  }
  .fc-progress-fill {
    height: 100%;
    background: var(--gold);
    transition: width 0.4s ease;
  }

  .flashcard {
    width: calc(100% - 40px);
    max-width: 480px;
    margin: 28px auto 16px;
    perspective: 1000px;
    cursor: pointer;
    user-select: none;
  }
  .fc-inner {
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 20px;
    min-height: 300px;
  }
  .fc-inner.flipped { transform: rotateY(180deg); }
  .fc-front, .fc-back {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 20px;
    padding: 32px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 300px;
    box-shadow: var(--shadow-hover);
  }
  .fc-front {
    background: white;
    border: 2px solid var(--border);
  }
  .fc-back {
    background: var(--ink);
    transform: rotateY(180deg);
    color: white;
  }

  .fc-level {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 16px;
    padding: 4px 10px;
    border-radius: 6px;
  }
  .fc-front .fc-level { background: var(--parchment); color: var(--ink-faint); }
  .fc-back .fc-level { background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.8); }

  .fc-pattern {
    font-family: 'Noto Serif SC', serif;
    font-size: 26px;
    font-weight: 700;
    text-align: center;
    color: var(--ink);
    line-height: 1.3;
    letter-spacing: 1px;
  }
  .fc-category {
    font-size: 11px;
    color: var(--ink-faint);
    margin-top: 10px;
    text-align: center;
  }
  .fc-tap-hint {
    margin-top: 24px;
    font-size: 11px;
    color: var(--ink-faint);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .fc-back .fc-explanation {
    font-family: 'Lora', serif;
    font-style: italic;
    font-size: 13px;
    color: rgba(255,255,255,0.8);
    text-align: center;
    line-height: 1.6;
    margin-bottom: 16px;
    width: 100%;
  }
  .fc-example {
    width: 100%;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 8px;
  }
  .fc-ex-zh {
    font-family: 'Noto Serif SC', serif;
    font-size: 15px;
    color: white;
    text-align: center;
  }
  .fc-ex-pinyin { font-size: 11px; color: var(--gold-light); text-align: center; margin-top: 4px; font-style: italic; }
  .fc-ex-es { font-size: 11px; color: rgba(255,255,255,0.7); text-align: center; margin-top: 3px; }

  .fc-audio-btn {
    margin-top: 16px;
    padding: 8px 20px;
    background: rgba(255,255,255,0.15);
    color: white;
    border: 1.5px solid rgba(255,255,255,0.3);
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.2s;
  }
  .fc-audio-btn:hover { background: rgba(255,255,255,0.25); }

  .fc-nav {
    display: flex;
    gap: 12px;
    margin-top: 16px;
    width: calc(100% - 40px);
    max-width: 480px;
  }
  .fc-nav-btn {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  #fc-prev { background: var(--parchment); color: var(--ink-light); }
  #fc-next { background: var(--ink); color: white; }
  #fc-next:hover { background: var(--gold); }

  /* ── COUNT TAG ── */
  .count-tag {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px; height: 20px;
    background: var(--parchment);
    border-radius: 50%;
    font-size: 10px;
    font-weight: 600;
    color: var(--ink-faint);
    margin-left: 6px;
  }

  .no-results {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-faint);
  }
  .no-results .emoji { font-size: 40px; margin-bottom: 12px; }
  .no-results p { font-family: 'Lora', serif; font-style: italic; font-size: 14px; }

  @media (min-width: 768px) {
    .cards-container { max-width: 700px; margin: 0 auto; padding: 16px 24px 100px; }
    .filter-bar { justify-content: center; }
    .fc-inner { min-height: 340px; }
    .fc-front, .fc-back { min-height: 340px; }
  }
</style>
</head>
<body>

<div class="app-header">
  <div class="header-title">语法宝典</div>
  <div class="header-sub">HSK 4 · 5 · 6 — Gramática China con Audio</div>
</div>

<div class="filter-bar" id="filterBar">
  <button class="filter-btn active-all" data-filter="all" onclick="setFilter('all',this)">✦ Todos</button>
  <button class="filter-btn" data-filter="4" onclick="setFilter('4',this)">HSK 4</button>
  <button class="filter-btn" data-filter="5" onclick="setFilter('5',this)">HSK 5</button>
  <button class="filter-btn" data-filter="6" onclick="setFilter('6',this)">HSK 6</button>
  <button class="filter-btn" data-filter="adv" onclick="setFilter('adv',this)">副词</button>
  <button class="filter-btn" data-filter="conj" onclick="setFilter('conj',this)">连词/复句</button>
  <button class="filter-btn" data-filter="prep" onclick="setFilter('prep',this)">介词</button>
  <button class="filter-btn" data-filter="pattern" onclick="setFilter('pattern',this)">固定格式</button>
  <button class="filter-btn" data-filter="compare" onclick="setFilter('compare',this)">近义辨析</button>
  <button class="filter-btn" data-filter="particle" onclick="setFilter('particle',this)">助词/词缀</button>
</div>

<div class="search-wrap">
  <span class="search-icon">🔍</span>
  <input type="search" class="search-input" placeholder="Buscar patrón, palabra, traducción…" oninput="doSearch(this.value)" id="searchInput">
</div>

<div class="stats-bar">
  <span class="stat-chip hsk4"><span class="stat-dot"></span>HSK 4</span>
  <span class="stat-chip hsk5"><span class="stat-dot"></span>HSK 5</span>
  <span class="stat-chip hsk6"><span class="stat-dot"></span>HSK 6</span>
</div>

<div class="cards-container" id="cardsContainer"></div>

<div class="mode-bar">
  <button class="mode-btn active" id="btnList" onclick="setMode('list')">📋 Lista</button>
  <button class="mode-btn" id="btnCards" onclick="setMode('flashcard')">🃏 Tarjetas</button>
</div>

<!-- FLASHCARD OVERLAY -->
<div class="flashcard-overlay" id="fcOverlay">
  <div class="fc-header">
    <div style="font-family:'Noto Serif SC',serif;font-size:16px;font-weight:700;">🃏 Tarjetas</div>
    <div class="fc-progress" id="fcProgress">1 / 1</div>
    <button class="fc-close" onclick="setMode('list')">✕</button>
  </div>
  <div class="fc-progress-bar"><div class="fc-progress-fill" id="fcFill" style="width:0%"></div></div>

  <div class="flashcard" onclick="flipCard()" id="flashcard">
    <div class="fc-inner" id="fcInner">
      <div class="fc-front">
        <div class="fc-level" id="fcLevel">HSK 4</div>
        <div class="fc-pattern" id="fcPattern">…</div>
        <div class="fc-category" id="fcCat">…</div>
        <div class="fc-tap-hint">👆 Toca para ver ejemplos</div>
      </div>
      <div class="fc-back">
        <div class="fc-level" id="fcLevelB">HSK 4</div>
        <div class="fc-explanation" id="fcExpl">…</div>
        <div id="fcExamples"></div>
        <button class="fc-audio-btn" onclick="event.stopPropagation();playFcAudio()">🔊 Escuchar</button>
      </div>
    </div>
  </div>

  <div class="fc-nav">
    <button class="fc-nav-btn" id="fc-prev" onclick="fcNav(-1)">← Anterior</button>
    <button class="fc-nav-btn" id="fc-next" onclick="fcNav(1)">Siguiente →</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  GRAMMAR DATA — HSK 4, 5, 6
// ═══════════════════════════════════════════════════════════
const DATA = [
  // ── HSK 4 ──────────────────────────────────────────────
  {
    hsk: 4, cat: "pattern",
    pattern: "不但…而且…",
    explanation: "No solo… sino también… Refuerza una afirmación añadiendo otra aún más fuerte.",
    examples: [
      { zh: "她不但会说中文，而且说得很流利。", pinyin: "Tā bùdàn huì shuō Zhōngwén, érqiě shuō de hěn liúlì.", es: "No solo sabe hablar chino, sino que además lo habla con fluidez." },
      { zh: "这家餐厅不但便宜，而且很好吃。", pinyin: "Zhè jiā cāntīng bùdàn piányí, érqiě hěn hǎochī.", es: "Este restaurante no solo es barato, sino que además está muy bueno." }
    ]
  },
  {
    hsk: 4, cat: "pattern",
    pattern: "只要…就…",
    explanation: "Siempre que… entonces… Expresa una condición suficiente.",
    examples: [
      { zh: "只要你努力，就会成功。", pinyin: "Zhǐyào nǐ nǔlì, jiù huì chénggōng.", es: "Siempre que te esfuerces, tendrás éxito." },
      { zh: "只要有时间，我就去看你。", pinyin: "Zhǐyào yǒu shíjiān, wǒ jiù qù kàn nǐ.", es: "Siempre que tenga tiempo, iré a verte." }
    ]
  },
  {
    hsk: 4, cat: "pattern",
    pattern: "虽然…但是…",
    explanation: "Aunque… sin embargo… Expresa contraste o concesión.",

      { zh: "比赛到晚上八点为止结束。", pinyin: "Bǐsài dào wǎnshang bā diǎn wéizhǐ jiéshù.", es: "La competición termina a las ocho de la noche." },
      { zh: "活动人数到一百人为止报名。", pinyin: "Huódòng rénshù dào yì bǎi rén wéizhǐ bàomíng.", es: "La inscripción está limitada a cien personas." }
    ]
  },
  {
    hsk: 6, cat: "pattern",
    pattern: "就算…也…",
    explanation: "Aunque… de todas formas… Concesión: la condición no cambia el resultado. Más enfático que 虽然…但是.",
    examples: [
      { zh: "就算下雨，我们也要去爬山。", pinyin: "Jiùsuàn xiàyǔ, wǒmen yě yào qù páshān.", es: "Aunque llueva, iremos de senderismo." },
      { zh: "就算失败一百次，他也不放弃。", pinyin: "Jiùsuàn shībài yì bǎi cì, tā yě bù fàngqì.", es: "Aunque fracase cien veces, no se rinde." }
    ]
  },
  {
    hsk: 6, cat: "compare",
    pattern: "人家 vs 别人 vs 咱们",
    explanation: "人家: indirecto/educado, puede referirse a uno mismo suavemente. 别人: otros objetivamente. 咱们: nosotros (incluyendo al interlocutor).",
    examples: [
      { zh: "你别总说人家的不是。", pinyin: "Nǐ bié zǒng shuō rénjiā de búshì.", es: "No estés siempre criticando a los demás." },
      { zh: "咱们一起走吧。", pinyin: "Zánmen yìqǐ zǒu ba.", es: "Vamos juntos." }
    ]
  },
  {
    hsk: 6, cat: "conj",
    pattern: "不料",
    explanation: "Inesperadamente / pero de repente. Introduce un resultado contrario a las expectativas.",
    examples: [
      { zh: "我们准备充分，不料还是失败了。", pinyin: "Wǒmen zhǔnbèi chōngfèn, bùliào háishì shībài le.", es: "Nos preparamos bien, pero inesperadamente fracasamos de todos modos." },
      { zh: "天气预报说晴天，不料下起了雨。", pinyin: "Tiānqì yùbào shuō qíngtiān, bùliào xià qǐ le yǔ.", es: "El pronóstico decía que haría sol, pero de repente se puso a llover." }
    ]
  },
  {
    hsk: 6, cat: "adv",
    pattern: "异常",
    explanation: "Anormalmente / inusualmente. Indica un grado que supera lo normal. Uso formal o descriptivo.",
    examples: [
      { zh: "最近天气异常炎热。", pinyin: "Zuìjìn tiānqì yìcháng yánrè.", es: "Últimamente el tiempo está inusualmente caluroso." },
      { zh: "他的表现异常冷静。", pinyin: "Tā de biǎoxiàn yìcháng lěngjìng.", es: "Su comportamiento era sorprendentemente calmado." }
    ]
  },
  {
    hsk: 6, cat: "adv",
    pattern: "较为",
    explanation: "Relativamente / comparativamente. Indica un grado moderado. Uso escrito o formal.",
    examples: [
      { zh: "这个问题较为复杂。", pinyin: "Zhège wèntí jiàowéi fùzá.", es: "Este asunto es relativamente complejo." },
      { zh: "这种方法在实践中较为有效。", pinyin: "Zhè zhǒng fāngfǎ zài shíjiàn zhōng jiàowéi yǒuxiào.", es: "Este método resulta relativamente eficaz en la práctica." }
    ]
  },
  {
    hsk: 6, cat: "particle",
    pattern: "于 (preposición formal)",
    explanation: "于: preposición formal que equivale a 在/从/到. Introduce tiempo o lugar. Uso principalmente escrito.",
    examples: [
      { zh: "会议将于下周举行。", pinyin: "Huìyì jiāng yú xià zhōu jǔxíng.", es: "La reunión se celebrará la semana que viene." },
      { zh: "事故发生于市中心。", pinyin: "Shìgù fāshēng yú shì zhōngxīn.", es: "El accidente ocurrió en el centro de la ciudad." }
    ]
  },
  {
    hsk: 6, cat: "prep",
    pattern: "至于",
    explanation: "En cuanto a… / por lo que respecta a… Introduce un nuevo tema o desplaza el foco de la conversación.",
    examples: [
      { zh: "至于结果，我们以后再谈。", pinyin: "Zhìyú jiéguǒ, wǒmen yǐhòu zài tán.", es: "En cuanto al resultado, lo hablaremos más adelante." },
      { zh: "至于他怎么想，其实并不重要。", pinyin: "Zhìyú tā zěnme xiǎng, qíshí bìng bù zhòngyào.", es: "En cuanto a lo que él piensa, en realidad no importa." }
    ]
  },
  {
    hsk: 6, cat: "prep",
    pattern: "因 (preposición formal)",
    explanation: "A causa de / debido a. Equivale a 因为, pero más formal. Uso principalmente escrito.",
    examples: [
      { zh: "因天气原因，活动取消。", pinyin: "Yīn tiānqì yuányīn, huódòng qǔxiāo.", es: "Por motivos meteorológicos, el evento se cancela." },
      { zh: "因系统升级，服务暂停。", pinyin: "Yīn xìtǒng shēngjí, fúwù zàntíng.", es: "Por actualización del sistema, el servicio está suspendido temporalmente." }
    ]
  },
  {
    hsk: 6, cat: "pattern",
    pattern: "动词+透了",
    explanation: "Verbo/Adj + 透 + 了: expresa el grado extremo de una acción o cualidad. 'Completamente / hasta los huesos'.",
    examples: [
      { zh: "他累透了。", pinyin: "Tā lèi tòu le.", es: "Está completamente agotado." },
      { zh: "孩子开心透了。", pinyin: "Háizi kāixīn tòu le.", es: "El niño está requetecontent." }
    ]
  },
  {
    hsk: 6, cat: "pattern",
    pattern: "一时…一时…",
    explanation: "Unas veces… otras veces… Describe estados o acciones alternos, indicando cambio o inestabilidad.",
    examples: [
      { zh: "天气一时晴，一时雨。", pinyin: "Tiānqì yīshí qíng, yīshí yǔ.", es: "El tiempo cambia entre sol y lluvia." },
      { zh: "他一时高兴，一时生气。", pinyin: "Tā yīshí gāoxìng, yīshí shēngqì.", es: "Unas veces está contento y otras enojado." }
    ]
  },
  {
    hsk: 6, cat: "pattern",
    pattern: "要么…要么…",
    explanation: "O… o… Expresa alternativas o elecciones excluyentes.",
    examples: [
      { zh: "要么去旅行，要么在家休息。", pinyin: "Yàome qù lǚxíng, yàome zài jiā xiūxi.", es: "O te vas de viaje o descansas en casa." },
      { zh: "要么努力学习，要么考试不及格。", pinyin: "Yàome nǔlì xuéxí, yàome kǎoshì bù jígé.", es: "O estudias en serio o suspendes el examen." }
    ]
  }
];

// ═══════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════
let currentFilter = 'all';
let currentSearch = '';
let currentMode = 'list';
let fcIndex = 0;
let fcFlipped = false;
let filteredData = [...DATA];

const CAT_FILTERS = ['adv','conj','prep','pattern','compare','particle'];

function getFiltered() {
  return DATA.filter(item => {
    let matchFilter;
    if (currentFilter === 'all') {
      matchFilter = true;
    } else if (CAT_FILTERS.includes(currentFilter)) {
      matchFilter = item.cat === currentFilter;
    } else {
      matchFilter = item.hsk == currentFilter;
    }
    const q = currentSearch.toLowerCase();
    const matchSearch = !q || item.pattern.toLowerCase().includes(q) ||
      item.explanation.toLowerCase().includes(q) ||
      item.examples.some(e => e.zh.includes(q) || e.pinyin.toLowerCase().includes(q) || e.es.toLowerCase().includes(q));
    return matchFilter && matchSearch;
  });
}

// ═══════════════════════════════════════════════════════════
//  AUDIO
// ═══════════════════════════════════════════════════════════
let speechSynth = window.speechSynthesis;
let voices = [];
let tingTing = null;

function loadVoices() {
  voices = speechSynth.getVoices();
  // iOS Ting-Ting
  tingTing = voices.find(v => v.name === 'Ting-Ting') ||
             voices.find(v => v.name.toLowerCase().includes('ting')) ||
             voices.find(v => v.lang === 'zh-CN' || v.lang === 'zh_CN') ||
             voices.find(v => v.lang.startsWith('zh'));
}

if (speechSynth.onvoiceschanged !== undefined) {
  speechSynth.onvoiceschanged = loadVoices;
}
loadVoices();

function speak(text, btn) {
  if (!speechSynth) return;
  speechSynth.cancel();
  
  // iOS unlock trick
  const unlock = new SpeechSynthesisUtterance(' ');
  speechSynth.speak(unlock);
  
  setTimeout(() => {
    loadVoices();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'zh-CN';
    utter.rate = 0.85;
    utter.pitch = 1.05;
    if (tingTing) utter.voice = tingTing;
    
    if (btn) {
      btn.classList.add('playing');
      btn.textContent = '🔊 …';
      utter.onend = () => { btn.classList.remove('playing'); btn.innerHTML = '<svg viewBox="0 0 10 10"><polygon points="2,1 9,5 2,9" fill="currentColor"/></svg> Escuchar'; };
    }
    speechSynth.speak(utter);
  }, 50);
}

// ═══════════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════════
const catLabels = { adv:'副词 Adverbios', conj:'复句/连词 Conjunciones', prep:'介词 Preposiciones', pattern:'固定格式 Patrones fijos', compare:'近义辨析 Comparación de similares', particle:'助词/词缀 Partículas y afijos' };
const catOrder = ['particle','adv','prep','conj','pattern','compare'];

function renderCards() {
  filteredData = getFiltered();
  const container = document.getElementById('cardsContainer');
  
  if (!filteredData.length) {
    container.innerHTML = `<div class="no-results"><div class="emoji">🔍</div><p>No se encontraron resultados para "${currentSearch}"</p></div>`;
    return;
  }
  
  // Group by level then category
  const groups = {};
  filteredData.forEach(item => {
    const key = `${item.hsk}_${item.cat}`;
    if (!groups[key]) groups[key] = [];
    groups[key].push(item);
  });
  
  let html = '';
  const isCatFilter = CAT_FILTERS.includes(currentFilter);
  const isLevelFilter = ['4','5','6'].includes(currentFilter);

  if (isCatFilter) {
    // Group by HSK level, no category sub-headers needed
    html += `<div class="section-label">${catLabels[currentFilter]} <span class="count-tag">${filteredData.length}</span></div>`;
    [4,5,6].forEach(lvl => {
      const lvlItems = filteredData.filter(i => i.hsk === lvl);
      if (!lvlItems.length) return;
      html += `<div class="section-label" style="font-size:11px;margin-left:8px;">HSK ${lvl} <span class="count-tag">${lvlItems.length}</span></div>`;
      lvlItems.forEach(item => {
        html += renderCard(item, filteredData.indexOf(item));
      });
    });
  } else {
    const levelOrder = isLevelFilter ? [parseInt(currentFilter)] : [4,5,6];
    levelOrder.forEach(lvl => {
      const lvlItems = filteredData.filter(i => i.hsk === lvl);
      if (!lvlItems.length) return;
      html += `<div class="section-label">HSK ${lvl} <span class="count-tag">${lvlItems.length}</span></div>`;
      const catGroups = {};
      lvlItems.forEach(i => { if(!catGroups[i.cat]) catGroups[i.cat]=[]; catGroups[i.cat].push(i); });
      catOrder.forEach(cat => {
        const items = catGroups[cat];
        if (!items) return;
        html += `<div class="section-label" style="font-size:11px;margin-left:8px;">${catLabels[cat]||cat} <span class="count-tag">${items.length}</span></div>`;
        items.forEach(item => { html += renderCard(item, filteredData.indexOf(item)); });
      });
      // uncategorized
      lvlItems.filter(i => !catOrder.includes(i.cat)).forEach(item => {
        html += renderCard(item, filteredData.indexOf(item));
      });
    });
  }

  container.innerHTML = html;
}

function renderCard(item, idx) {
  const badge = `<span class="hsk-badge badge-${item.hsk}">HSK ${item.hsk}</span>`;
  const catStr = catLabels[item.cat] || item.cat;
  
  let exHtml = item.examples.map((ex, ei) => `
    <div class="example-item">
      <div class="example-zh">${ex.zh}</div>
      <div class="example-pinyin">${ex.pinyin}</div>
      <div class="example-es">${ex.es}</div>
      <button class="play-btn" onclick="event.stopPropagation();playEx(this,'${ex.zh.replace(/'/g,"\\'")}')">
        <svg viewBox="0 0 10 10"><polygon points="2,1 9,5 2,9" fill="currentColor"/></svg> Escuchar
      </button>
    </div>`).join('');
  
  return `
    <div class="grammar-card" onclick="toggleCard(this,${idx})" data-idx="${idx}">
      <div class="card-header">
        ${badge}
        <div class="card-main">
          <div class="card-pattern">${item.pattern}</div>
          <div class="card-category">${catStr}</div>
        </div>
        <div style="color:var(--ink-faint);font-size:18px;margin-top:2px;transition:transform 0.2s" class="arrow-icon">›</div>
      </div>
      <div class="card-body">
        <div class="explanation-box">${item.explanation}</div>
        <div class="examples-title">EJEMPLOS DE USO</div>
        ${exHtml}
      </div>
    </div>`;
}

function toggleCard(el, idx) {
  const wasExpanded = el.classList.contains('expanded');
  document.querySelectorAll('.grammar-card.expanded').forEach(c => {
    c.classList.remove('expanded');
    const arr = c.querySelector('.arrow-icon');
    if (arr) arr.style.transform = '';
  });
  if (!wasExpanded) {
    el.classList.add('expanded');
    const arr = el.querySelector('.arrow-icon');
    if (arr) arr.style.transform = 'rotate(90deg)';
  }
}

function playEx(btn, text) {
  btn.innerHTML = '⏳ …';
  speak(text, btn);
}

// ═══════════════════════════════════════════════════════════
//  FILTERS & SEARCH
// ═══════════════════════════════════════════════════════════
function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.className = 'filter-btn';
  });
  if (f === 'all') btn.classList.add('active-all');
  else if (f === '4') btn.classList.add('active-4');
  else if (f === '5') btn.classList.add('active-5');
  else if (f === '6') btn.classList.add('active-6');
  else btn.classList.add('active-cat');
  renderCards();
}

function doSearch(q) {
  currentSearch = q;
  renderCards();
}

// ═══════════════════════════════════════════════════════════
//  MODES
// ═══════════════════════════════════════════════════════════
function setMode(mode) {
  currentMode = mode;
  document.getElementById('btnList').classList.toggle('active', mode === 'list');
  document.getElementById('btnCards').classList.toggle('active', mode === 'flashcard');
  
  const overlay = document.getElementById('fcOverlay');
  if (mode === 'flashcard') {
    filteredData = getFiltered();
    fcIndex = 0;
    overlay.classList.add('active');
    renderFlashcard();
  } else {
    overlay.classList.remove('active');
    document.getElementById('fcInner').classList.remove('flipped');
    fcFlipped = false;
  }
}

// ═══════════════════════════════════════════════════════════
//  FLASHCARD
// ═══════════════════════════════════════════════════════════
function renderFlashcard() {
  const item = filteredData[fcIndex];
  if (!item) return;
  
  const total = filteredData.length;
  document.getElementById('fcProgress').textContent = `${fcIndex+1} / ${total}`;
  document.getElementById('fcFill').style.width = `${((fcIndex+1)/total)*100}%`;
  
  document.getElementById('fcLevel').textContent = `HSK ${item.hsk}`;
  document.getElementById('fcLevelB').textContent = `HSK ${item.hsk}`;
  document.getElementById('fcPattern').textContent = item.pattern;
  document.getElementById('fcCat').textContent = catLabels[item.cat] || item.cat;
  document.getElementById('fcExpl').textContent = item.explanation;
  
  const exHtml = item.examples.slice(0,2).map(ex => `
    <div class="fc-example">
      <div class="fc-ex-zh">${ex.zh}</div>
      <div class="fc-ex-pinyin">${ex.pinyin}</div>
      <div class="fc-ex-es">${ex.es}</div>
    </div>`).join('');
  document.getElementById('fcExamples').innerHTML = exHtml;
  
  // Reset flip
  document.getElementById('fcInner').classList.remove('flipped');
  fcFlipped = false;
}

function flipCard() {
  fcFlipped = !fcFlipped;
  document.getElementById('fcInner').classList.toggle('flipped', fcFlipped);
}

function fcNav(dir) {
  filteredData = getFiltered();
  fcIndex = (fcIndex + dir + filteredData.length) % filteredData.length;
  renderFlashcard();
}

function playFcAudio() {
  const item = filteredData[fcIndex];
  if (!item || !item.examples.length) return;
  speak(item.examples[0].zh);
}

// ═══════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════
renderCards();
</script>
